<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>147 · replay check</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; }
    body { background: #0f1513; color: #d8e0dc; font: 14px/1.4 system-ui, sans-serif; display: flex; flex-direction: column;
           padding: 8px; box-sizing: border-box; gap: 8px; }
    header { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    button { background: #1c2422; color: inherit; border: 1px solid #34403c; border-radius: 6px; padding: 8px 12px;
             min-height: 44px; cursor: pointer; font: inherit; }
    button.on { background: #f2c94c; color: #111; border-color: #f2c94c; }
    #play { background: #27ae60; border-color: #27ae60; color: #fff; font-weight: 600; }
    main { flex: 1; min-height: 0; min-width: 0; display: flex; gap: 8px; }
    figure { margin: 0; flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
    figcaption { opacity: .7; font-size: 12px; }
    /* the canvas sits absolutely inside its box, so its pixel size can never push the page wider than the screen */
    .box { flex: 1; min-height: 0; position: relative; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; background: #0b0f0e; border-radius: 6px; display: block; }
    #status { font-variant-numeric: tabular-nums; opacity: .85; width: 100%; }

    /* "3D only": a phone-shaped screen with gray placeholder boxes where mockups A/C/D put the game controls */
    #phone { display: none; }
    body.only3d > header, body.only3d > main { display: none; }
    body.only3d { padding: 0; align-items: center; }
    body.only3d #phone { display: block; position: fixed; top: 0; bottom: 0; left: 50%; transform: translateX(-50%);
                         width: min(100vw, calc(100vh * var(--aspect)));
                         background: #0f1513; outline: 1px solid #34403c; }
    #phone .ph { position: absolute; box-sizing: border-box; border: 1px dashed #4a5753; border-radius: 10px;
                 background: rgba(255,255,255,0.04); color: #8a9792; font-size: 12px;
                 display: flex; align-items: center; justify-content: center; gap: 6px; }
    #phone .ph button { min-height: 0; padding: 4px 8px; font-size: 12px; }
    #phone .tableArea { border: none; background: none; }
    #phone .shoot { cursor: pointer; font-weight: 700; font-size: 18px; color: #d8e0dc; }
    #phone .ladder { justify-content: space-between; padding: 0 4px; }
    #phone .ladder span { flex: 1; margin: 0 2px; height: 70%; border: 1px dashed #4a5753; border-radius: 8px; }
  </style>
</head>
<body>
  <header>
    <span id="shots"></span>
    <button id="play">Play</button>
    <button id="slow">Slow 1/4</button>
    <span id="cams"></span>
    <span id="scales"></span>
    <button id="layout">3D only (game layout)</button>
    <span id="status"></span>
  </header>
  <main>
    <figure id="fig2d"><figcaption>2D top view (debug)</figcaption><div class="box"><canvas id="c2d"></canvas></div></figure>
    <figure id="fig3d"><figcaption>3D main camera (gray-box)</figcaption><div class="box" id="box3d"><canvas id="c3d"></canvas></div></figure>
  </main>
  <div id="phone"></div>
  <script type="module" src="/src/replay/replayPage.ts"></script>
</body>
</html>
