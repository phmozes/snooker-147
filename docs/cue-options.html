const table = buildTable();

const V = CONFIG.view3d, TC = CONFIG.table;
const A = { bg: '#0b0907', cloth: '#1c6a37', oldCushion: '#1a6133', wood: '#4a2412' }; // look A colours (look-options.html)

// Drawn heights (m). Rail top highest, cushion top a little lower, bed at 0, hole below the bed.
const H = { cushion: 0.040, rail: 0.050, pit: 0.10, railBottom: -0.10 };
// S1 (round 5, after the owner's sketch): the whole physics drop circle is drawn as a round black hole, with a net in
// its back half; the rail wood stops at each side of the pocket; a light tan leather arc bridges the gap round the
// outside of the hole; each cushion narrows to a point where its nose (the physics jaw) meets the rail line.
//   `width` of the leather arc outside the hole edge, `lip` = how far it hangs over the hole edge, `over` = how far
//   (angle, rad) the arc runs on over each rail end, `netTop` / `netBottom` = height of the net at the rim / middle.
// R2 (round 4): the rail top overhangs the back of the hole: the cushions end at depth `db`, the visible black closes
//   behind them (`bulge` deep, as wide as the mouth), and a dark leather cap reaches forward over the cushion ends
//   (`tB` = how far back along the jaw, angle in rad; cap `back` = width behind the hole, `over` = overlap onto the wood).
// T1 (round 6, after the owner's two photos of a real table): black at the front of the pocket, a bright net behind it,
//   and peach-tan leather at the back with a lighter inner lip (`lip2` = half its width).
//   Corner: a round hole; the green runs on beside the throat as a thin strip up to the hole, and the rail ends are
//   rounded to follow it. The leather is a band just inside the outer line of the table, from rail end to rail end:
//   `band` wide round the bend, growing (power `taper`) towards its ends, where it reaches in to the hole and starts
//   at the point where the green strip meets the rail end; the hole is open up to it and the net hangs almost straight down from its inner edge.
//   Middle: a straight opening as wide as the physics mouth. The green of each cushion runs on into the pocket as a
//   thin strip along the side of the hole (following the physics jaw) up to the leather. Behind the net a leather plate
//   fills the gap between the rail ends and stays inside the outer edge of the wood. plate: `front` = depth where its
//   side arms start, `depth` = how far the net reaches behind that, `side` = width of the arms, `inset` = how far its
//   outer edge stays inside the wood edge, `round` = how much that edge is rounded, `strip` = width of the green strips.
//   The net hangs almost straight down from the rim along the back AND both sides of the hole: `netFront` = depth
//   where it starts on the sides, `netLean` = how far it leans inwards on its way down.
//   `netFade` = depth over which the net fades in: it shows only in the back half of each hole, the front is pure black.
const DRAW = {
  t1: { band: 0.020, taper: 2, inset: 0.014, netFade: 0.035, curl: 0.006, netTop: 0.046, netBottom: -0.095, lip2: 0.0035,
    plate: { front: 0.040, depth: 0.050, side: 0.016, inset: 0.004, round: 0.008, netFront: -0.03, strip: 0.012, netLean: 0.03 } },
  s1: { width: 0.026, lip: 0.001, over: { corner: 0.08, middle: 0.45 }, netTop: 0.046, netBottom: -0.06 },
  r2: { corner: { db: 0.034, bulge: 0.071, tB: 0.10 }, middle: { db: 0, bulge: 0.030, tB: 0.70 } },
  cap: { back: 0.030, over: 0.006 },

// `fall` / `fallWidth` = darkness and width of the shadow on the bed at the front of each hole; `jaw` = how much darker the
// cushion faces get where they look into a pocket (T1).
// T1 leather: `bump` = how strongly the lamp picks out its rounded top; its soft shadow on the wood: `width` (m) and `dark` (0..1)
const SHADE = { bump: 2.5, width: 0.026, dark: 0.72, fall: 0.75, fallWidth: 0.026, jaw: 0.9 };
const CORNER_ROUND = 0.12; // outer corners of the rail are rounded (radius, m)

// lies exactly on the edge of the slate cut
const CW = (() => { const p = table.pockets.find((q) => q.kind === 'middle'), dc = p.fallFront + p.captureRadius;
  return Math.sqrt(p.captureRadius ** 2 - dc ** 2) - (TC.middle.mouth + TC.mouthExtra) / 2; })();

const OPTIONS = {
  T1: { label: 'T1', name: 'After the photos', line: 'Black at the front, a deep net behind it, peach-tan leather with a lighter inner lip. The green runs on along the sides of each hole and the rail ends are rounded to match. Corner leather: thin round the bend, thicker towards its ends, starting where the green meets the rail end. Leather shaded as a rounded piece with a soft shadow; the net shows only in the back half of each hole.', mode: 't1' },
  S1: { label: 'S1', name: 'Last round', line: 'After the sketch: round black hole, net in the back half, thin tan leather arc.', mode: 's1' },
  Before: { label: 'Before', name: 'Current drawing', line: 'Today\'s look A: darker cushion strip up to the hole, cushion ends drawn past the rail, flat black disc with a ring on top.' },
};
const BALL = { cue: '#f6f3e8', red: '#c8161d', yellow: '#f4c430', green: '#14804a', brown: '#7a4a24', blue: '#1f5fcf', pink: '#f58fb0', black: '#0d0d0d' };

  const back = ell(D.bulge, m2);

    const jr = r - w - DRAW.cap.over, T = [db, m2], B = [-jr * Math.sin(D.tB), m2 + r - jr * Math.cos(D.tB)];

    for (const [d, l] of edge) if (l < hwid(d) - 1e-9) throw new Error(`pocket ${p.id}: the leather cap covers the physics mouth`);

    for (let n = 0; n < 12; n++) outer = outer.map((q, i) => { // round off its outer corners
      if (i < 12 || i > outer.length - 13) return q;

  for (const [d, l] of arc(sweep, 0, r)) for (const s of [1, -1]) {
    const q = W([d, s * l]);
    const err = Math.min(...table.jaws.filter((j) => j.pocket === p.id).map((j) => Math.abs(Math.hypot(q.x - j.centre.x, q.y - j.centre.y) - r)));
    if (err > 1e-9) throw new Error(`pocket ${p.id}: drawn jaw is ${err} m off the physics jaw`);

  const demo = [
    { kind: 'red', pos: W([ff + 0.010, -0.014]), z: R * S - 0.014 },
    { kind: 'yellow', pos: W([nose[0] + R * ny[0], nose[1] + R * ny[1]]), z: R * S },

    cap: toW(cap), into, demo, geo: { r, m2, w, sweep, W, hwid, dS, dc, Rc, sideA, noseFrom } };
}
function makeShapes() {
  const list = table.pockets.map((p) => pocketShapes(p));

const shapes = makeShapes(); // bed outline, demo balls and close-up cameras are the same for every option

// ---------- S1 / T1 pocket (same frame: d = depth, l = sideways). `nextMid` = mouth of the next pocket round the table ----------
function s1Pocket(s, nextMid, style) {
  const { r, m2, w, sweep, W, hwid, dS, dc, Rc, sideA, noseFrom } = s.geo, D = DRAW[style], slot = style === 't1' && s.p.kind === 'middle';
  const circ = (rad, f) => [dc + rad * Math.cos(f), rad * Math.sin(f)];

  const k = clamp01((tau - V.appear) / V.stroke);
  const gap = sinceHit < 0 ? CUE.pull * (1 - k * k) : -CUE.follow * (1 - (1 - clamp01(sinceHit / CUE.followTime)) ** 2);
  const alpha = tau < 0 ? 0 : Math.min(clamp01(tau / V.appear), 1 - clamp01((sinceHit - CUE.fadeOutDelay) / CUE.fadeOut));
  return { gap, alpha };
}
function frame(tau) {
  const plan = PLANS[shotIx], V = VARIANTS[variant], t = tau - V.added; // t = seconds since the cue ball started
  OTHERS.forEach((b, i) => otherMeshes[i].position.set(b.pos.x, b.pos.y, RS));
  otherMeshes.forEach((m) => { m.visible = true; });
  let c = plan.C;
  if (t > 0) {
    const tc = t - plan.tHit;
    c = tc <= 0 ? add(plan.C, plan.d, TIMING.ballSpeed * t) : add(plan.G, plan.tang, run(plan.vC, plan.aC, tc));
    if (tc > 0) {
      const om = otherMeshes[SHOTS[shotIx].obj];
      if (miss) { const p = add(plan.O, plan.uMiss, run(plan.vO, plan.aMiss, tc)); om.position.set(p.x, p.y, RS); }
      else if (tc < plan.tPot) { const p = add(plan.O, plan.u, run(plan.vO, plan.aPot, tc)); om.position.set(p.x, p.y, RS); }
      else { const z = RS - (tc - plan.tPot) * 1.5; om.position.set(plan.P.x, plan.P.y, z); om.visible = z > -H.pit; }
    }
  }
  cueBall.position.set(c.x, c.y, RS);
  for (const m of Object.values(cues)) m.visible = false;
  if (V.cue) {
    const m = cues[V.cue], { gap, alpha } = cuePose(plan, V, tau);
    if (alpha > 0.003) {
      m.visible = true; m.material.opacity = alpha; m.castShadow = V.cue === 'full' && alpha > 0.5;
      m.quaternion.setFromUnitVectors(Y, plan.axis);
      m.position.set(plan.C.x, plan.C.y, RS).addScaledVector(plan.axis, RS + gap);
    }
  }
  flash.visible = false;
  if (V.flash && t >= 0 && t < CUE.flashTime) {
    const p = t / CUE.flashTime;
    flash.visible = true; flash.material.opacity = 1 - p * p;
    flash.position.set(plan.C.x - plan.d.x * RS, plan.C.y - plan.d.y * RS, RS * 1.15); flash.scale.setScalar(RS * (2 + (CUE.flashSize - 2) * p));
  }
  document.getElementById('shoot').classList.toggle('down', tau >= 0 && tau < TIMING.press);
  if (camera) renderer.render(scene, camera);
}

// Rule check, on the real screen: at no moment may the cue cover the object ball or the pocket the shot is aimed at.
function checkHidden() {
  const warn = [];
  if (camera) for (const [id, V] of Object.entries(VARIANTS)) if (V.cue) for (const [i, plan] of PLANS.entries()) {
    const px = (v3) => { const q = v3.clone().project(camera); return { x: (q.x + 1) / 2 * canvas.clientWidth, y: (1 - q.y) / 2 * canvas.clientHeight }; };
    const L = V.cue === 'tip' ? CUE.tipOnly : CUE.length, centre = new THREE.Vector3(plan.C.x, plan.C.y, RS);
    const targets = [[new THREE.Vector3(plan.O.x, plan.O.y, RS), RS, 'object ball'], [new THREE.Vector3(plan.P.x, plan.P.y, 0), byId[SHOTS[i].pocket].captureRadius, 'pocket']];
    for (const [p3, rad, what] of targets) {
      const p = px(p3), r = len(sub(px(p3.clone().add(new THREE.Vector3(rad, 0, 0))), p));
      for (const gap of [CUE.pull, 0, -CUE.follow]) for (let s = 0; s <= L; s += 0.02) {
        const q = px(centre.clone().addScaledVector(plan.axis, RS + gap + s));
        if (len(sub(q, p)) < r + 4) { warn.push(id + ' ' + SHOTS[i].label + ': cue covers the ' + what); s = L; }
      }
    }
  }
  window.__hidden = warn;
  if (warn.length) document.getElementById('desc').textContent = 'RULE BROKEN: ' + [...new Set(warn)].join('; ');
}

// ---------- controls and loop ----------
const q = new URLSearchParams(location.search), freeze = q.has('freeze') ? Number(q.get('freeze')) : null;
let variant = VARIANTS[location.hash.slice(1)] ? location.hash.slice(1) : 'C1', shotIx = Math.min(2, Math.max(0, Number(q.get('shot')) || 0));
let miss = q.get('miss') === '1', t0 = performance.now();
function labels() {
  const V = VARIANTS[variant], plan = PLANS[shotIx];
  document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('on', b.dataset.id === variant));
  document.querySelectorAll('#shots button[data-ix]').forEach((b) => b.classList.toggle('on', Number(b.dataset.ix) === shotIx));
  if (!window.__hidden?.length) document.getElementById('desc').innerHTML = `<b>${variant} · ${V.name}</b> — ${V.line}`;
  const parts = V.cue ? `appear ${V.appear.toFixed(2)} + stroke ${V.stroke.toFixed(2)}` : V.flash ? 'flash plays while the ball moves' : 'as today';
  document.getElementById('time').innerHTML = `Added time per shot: <b>+${V.added.toFixed(2)} s</b> <span>(${parts})</span>`;
  document.getElementById('result').textContent = `this time: ${miss ? 'MISS' : 'POT'}` + (V.cue ? ` · cue raised ${Math.round(plan.el * 180 / Math.PI)}°` : '');
}
function restart(keepResult) { if (!keepResult) miss = false; t0 = performance.now(); labels(); }
const tabs = document.getElementById('tabs'), shotsBox = document.getElementById('shots');
for (const id of Object.keys(VARIANTS)) { const b = document.createElement('button'); b.textContent = id; b.dataset.id = id;
  b.onclick = () => { variant = id; history.replaceState(null, '', '#' + id); restart(true); }; tabs.appendChild(b); }
SHOTS.forEach((s, i) => { const b = document.createElement('button'); b.textContent = s.label; b.dataset.ix = i; b.onclick = () => { shotIx = i; restart(); }; shotsBox.appendChild(b); });
{ const b = document.createElement('button'); b.id = 'again'; b.textContent = '↻ Play again'; b.onclick = () => restart(true); shotsBox.appendChild(b); }
function tick(now) {
  let tau = (now - t0) / 1000 - TIMING.before;
  if (tau > VARIANTS[variant].added + PLANS[shotIx].end + TIMING.after) { miss = !miss; restart(true); tau = -TIMING.before; } // loop: pot, miss, pot, ...
  frame(freeze ?? tau);
  requestAnimationFrame(tick);
}
window.addEventListener('resize', resize);
resize(); labels(); frame(freeze ?? -1);
requestAnimationFrame(tick);
window.__ready = true;
</script>
</body>
