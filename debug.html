<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>147 · table debug</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; background: #0f1513; color: #d8e0dc; font: 14px/1.4 system-ui, sans-serif;
           display: flex; gap: 16px; padding: 16px; box-sizing: border-box; height: 100vh; }
    canvas { background: #0b0f0e; border-radius: 8px; height: calc(100vh - 32px); aspect-ratio: 0.56; }
    aside { width: 300px; display: flex; flex-direction: column; gap: 12px; overflow: auto; }
    h1 { font-size: 16px; margin: 0; }
    .row { display: flex; flex-wrap: wrap; gap: 6px; }
    button { background: #1c2422; color: inherit; border: 1px solid #34403c; border-radius: 6px;
             padding: 6px 10px; cursor: pointer; font: inherit; }
    button.on { background: #f2c94c; color: #111; border-color: #f2c94c; }
    pre { background: #151c1a; padding: 10px; border-radius: 6px; margin: 0; white-space: pre-wrap; }
    .ok { color: #6fcf97; } .bad { color: #eb5757; }
    @media (max-width: 700px) { body { flex-direction: column; height: auto; }
      canvas { height: auto; width: 100%; } aside { width: auto; } }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <aside>
    <h1>Table debug (task 1.1)</h1>
    <div><b>Level</b><div class="row" id="levels"></div></div>
    <div><b>View</b><div class="row" id="views"></div></div>
    <div><b>Show</b><div class="row" id="toggles"></div></div>
    <pre id="info"></pre>
  </aside>
  <script type="module" src="/src/debug/tableDebug.ts"></script>
</body>
</html>
